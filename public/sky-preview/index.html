<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Lamplight Sky Preview</title>
    <link rel="stylesheet" href="/sky-preview/sky-preview.css">
  </head>
  <body>
    <main>
      <header><p class="eyebrow">Lamplight sky study</p><h1>Twelve constellations</h1><p>Production renderer at receipt and panel sizes.</p></header>
      <section><h2>Receipt size</h2><div id="receipt-grid" class="receipt-grid"></div></section>
      <section><h2>Corner panel</h2><div class="panel-stage"><canvas id="panel" width="460" height="200"></canvas><p>Actual panel proportions, shown at 2× for review. The production panel has no internal constellation names except the current-progress caption.</p></div></section>
      <section><h2>Leo states</h2><div id="states" class="states"></div></section>
    </main>
    <script type="module" src="/sky-preview/sky-preview.js"></script>
  </body>
</html>
